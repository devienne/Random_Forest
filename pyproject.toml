[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cascadia-fault-slip"
version = "0.1.0"
description = "Predict GPS fault displacement rate from seismic noise features using Random Forest (Cascadia subduction zone)"
authors = [{ name = "José Augusto Proença Maia Devienne", email = "joseaugusto.devienne@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "obspy>=1.4",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "requests>=2.31",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "black>=24.0",
]
phase2 = [
    "mlflow>=2.11",
    "pyarrow>=15.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]
phase3 = [
    "evidently>=0.4",
]

[project.scripts]
train = "src.pipelines.train:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = ["src/db/*", "app/*"]
